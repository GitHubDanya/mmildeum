name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Verify (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Type-Check & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check --if-present
          npm run build

      - name: Install & Compile-Check Backend
        working-directory: backend
        run: |
          uv sync
          uv run python -m compileall -q app

      - name: Smoke Test Combined Server
        working-directory: backend
        run: |
          uv run fastapi run app/main.py --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          # Verify both the FastAPI endpoint and the mounted Svelte build respond with 200
          curl -f http://127.0.0.1:8000/api/health
          curl -f http://127.0.0.1:8000/ > /dev/null

      - name: Package Release Bundle
        run: |
          mkdir -p dist
          tar --exclude='backend/.venv' \
              --exclude='**/__pycache__' \
              --exclude='**/*.pyc' \
              -czf dist/mmildeum-linux-x86_64.tar.gz \
              backend/app \
              backend/pyproject.toml \
              backend/uv.lock \
              frontend/build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmildeum-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
